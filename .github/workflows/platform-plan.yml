name: Platform plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - organization
          - management
          - connectivity

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_deployment_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_lab_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_profile: lab

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote state
        shell: bash
        run: |
          terraform -chdir="platform/${{ matrix.root }}" init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ matrix.root }}" \
            -backend-config="key=${{ matrix.root }}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Create a non-sensitive plan summary
        shell: bash
        run: |
          set +e
          terraform -chdir="platform/${{ matrix.root }}" plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan \
            >"${RUNNER_TEMP}/${{ matrix.root }}-plan.log" 2>&1
          plan_exit=$?
          set -e

          if [ "${plan_exit}" -eq 1 ]; then
            sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}/<redacted-id>/g' \
              "${RUNNER_TEMP}/${{ matrix.root }}-plan.log"
            exit 1
          fi

          if [ "${plan_exit}" -eq 0 ]; then
            result="No changes"
          else
            result="Changes detected; run the protected apply workflow after review"
          fi

          {
            echo "### Platform plan: ${{ matrix.root }}"
            echo
            echo "${result}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove generated plan
        if: always()
        shell: bash
        run: rm -f "platform/${{ matrix.root }}/tfplan"
